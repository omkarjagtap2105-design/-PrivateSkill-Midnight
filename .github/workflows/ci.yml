name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      # NOTE: Compact compiler compilation is skipped in CI.
      # The `compact` binary requires a local installation that is not
      # available in the CI environment. Run `npm run compile` locally
      # to generate the managed/ artifacts before committing them.

      - name: Run tests
        run: npm test

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
